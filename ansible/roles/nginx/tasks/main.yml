---
- name: Charger les variables spécifiques à l'OS
  include_vars: "{{ ansible_os_family }}.yml"

- name: Installer nginx
  package:
    name: "{{ nginx_package }}"
    state: present

- name: Démarrer et activer nginx
  service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true

- name: Déployer la page d'accueil dynamique
  template:
    src: index.html.j2
    dest: "{{ nginx_doc_root }}/index.html"
    owner: "{{ nginx_web_user }}"
    group: "{{ nginx_web_group }}"
    mode: '0644'
  notify: Redémarrer nginx

- name: Vérifier que nginx répond
  uri:
    url: http://localhost
    status_code: 200
