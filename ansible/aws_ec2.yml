plugin: amazon.aws.aws_ec2
regions:
  - eu-west-3
filters:
  tag:Name: terraform-lab
  instance-state-name: running
hostnames:
  - ip-address
compose:
  ansible_user: "'ec2-user'"
  ansible_ssh_private_key_file: "'~/.ssh/terraform-lab'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no'"
groups:
  web: "tags.Name == 'terraform-lab'"
